[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "maestro-sdk"
version = "1.0.0"
description = "The simple, unified automation SDK for Python — rules, batch, flows and state machines."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["rules-engine", "batch-processing", "workflow", "state-machine", "automation", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
yaml  = ["PyYAML>=6.0"]
dev   = ["pytest>=8.0", "pytest-cov>=4.0", "PyYAML>=6.0"]

[project.urls]
Repository = "https://github.com/your-org/maestro-sdk"

[tool.setuptools.packages.find]
where = ["."]
include = ["maestro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v"

[project.scripts]
maestro = "maestro.cli:main"
